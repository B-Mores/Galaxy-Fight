<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>حرب المجرات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b12; --panel:#121924; --panel-light:#1a2332; --line:#243245;
    --gold:#c9a45c; --gold-dim:#8a7142; --ink:#f0ece1; --ink-dim:#94a3b8;
    --danger:#ef4444; --ok:#22c55e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif;height:100%;overflow:hidden;}
  h1,h2,h3,.disp{font-family:'Cairo',sans-serif;}
  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}

  .center-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center;overflow-y:auto;}
  .brand{font-weight:900;font-size:clamp(26px,5vw,42px);letter-spacing:1px;color:var(--gold);margin:0 0 6px;text-shadow:0 0 25px rgba(201,164,92,0.3);}
  .brand-sub{color:var(--ink-dim);margin:0 0 28px;font-size:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:460px;box-shadow:0 8px 32px rgba(0,0,0,0.5);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:#1b1508;border:none;border-radius:10px;padding:12px 20px;font-family:'Cairo',sans-serif;font-weight:700;font-size:15px;cursor:pointer;transition:transform .1s, background .15s, box-shadow .15s;width:100%;}
  .btn:hover{background:#dab976;box-shadow:0 0 16px rgba(201,164,92,0.4);}
  .btn:active{transform:scale(.97);}
  .btn.secondary{background:transparent;border:1px solid var(--gold-dim);color:var(--gold);}
  .btn.secondary:hover{background:rgba(201,164,92,.12);}
  .btn.small{width:auto;padding:6px 12px;font-size:12px;border-radius:8px;}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.ok{background:var(--ok);color:#fff;}
  .btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none;}
  .stack{display:flex;flex-direction:column;gap:10px;margin-top:16px;}

  .battle-item{background:var(--panel-light);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;text-align:right;}
  .battle-item .meta{font-size:12px;color:var(--ink-dim);margin-top:3px;}
  .battle-item .name{font-weight:700;font-family:'Cairo',sans-serif;font-size:15px;}

  input[type=text], input[type=number]{background:#090d14;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px 12px;font-family:'Tajawal',sans-serif;font-size:14px;width:100%;transition:border-color .2s;}
  input:focus{outline:none;border-color:var(--gold);}
  label{font-size:13px;color:var(--ink-dim);display:block;margin-bottom:6px;}

  .team-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
  .swatch{width:26px;height:26px;border-radius:50%;flex:0 0 26px;border:2px solid rgba(255,255,255,.3);box-shadow:0 0 8px currentColor;}

  #board-screen{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}
  
  /* Topbar & score bar */
  .topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:6px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:20;flex-shrink:0;}
  .score-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;}
  .score-pill{display:flex;align-items:center;gap:6px;font-family:'Cairo',sans-serif;font-weight:700;font-size:12px;padding:4px 8px;border-radius:999px;background:var(--panel-light);border:1.5px solid var(--line);white-space:nowrap;transition:all .2s;}
  .score-pill.active-pill{transform:scale(1.05);box-shadow:0 0 12px currentColor;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 10px;box-shadow:0 0 6px currentColor;}
  .score-btn{
    width:20px;height:20px;border-radius:50%;border:1px solid var(--gold-dim);background:rgba(201,164,92,0.1);color:var(--gold);
    font-family:'Cairo',sans-serif;font-weight:900;font-size:12px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;transition:all .15s;
  }
  .score-btn:hover{background:var(--gold);color:#000;}

  .btnrow{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;}

  /* Main Map Area */
  .main-area{flex:1;display:flex;position:relative;overflow:hidden;background:#03060f;touch-action:none;}
  .map-wrap{
    flex:1;
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
    background-color:#03060f; 
    background-image: 
      radial-gradient(circle at 20% 25%, rgba(34, 197, 94, 0.12), transparent 45%),
      radial-gradient(circle at 80% 25%, rgba(239, 68, 68, 0.12), transparent 45%),
      radial-gradient(circle at 20% 75%, rgba(59, 130, 246, 0.12), transparent 45%),
      radial-gradient(circle at 80% 75%, rgba(234, 179, 8, 0.12), transparent 45%);
    display:flex;
    align-items:center;
    justify-content:center;
    user-select:none;
    touch-action:none;
  }
  svg#map{
    width:100%;
    height:100%;
    display:block;
    cursor:grab;
    user-select:none;
    touch-action:none;
  }
  svg#map:active{cursor:grabbing;}
  
  .link{stroke:rgba(255,255,255,0.09);stroke-width:1.2;pointer-events:none;}
  .celestial-glow{fill:none;stroke-width:3;stroke-opacity:0.25;transition:all .3s;}
  .celestial{cursor:default;transition:transform .2s, filter .2s;transform-origin:center;}
  .celestial.clickable-region{cursor:pointer;}
  .celestial.clickable-region:hover{filter:brightness(1.4);}
  
  /* Attacker & Defender Highlighting on Map */
  .celestial.sel-attacker .celestial-glow{
    stroke-width:10 !important;stroke-opacity:1 !important;
    animation:attackerPulse 1.2s infinite alternate;
  }
  .celestial.sel-defender .celestial-glow{
    stroke-width:10 !important;stroke-opacity:1 !important;
    animation:defenderPulse 0.9s infinite alternate;
  }
  @keyframes attackerPulse{
    0%{stroke-width:6;stroke-opacity:0.7;}
    100%{stroke-width:14;stroke-opacity:1;}
  }
  @keyframes defenderPulse{
    0%{stroke-width:6;stroke-opacity:0.7;}
    100%{stroke-width:14;stroke-opacity:1;}
  }

  /* Target Attack Beam */
  .attack-beam{
    stroke-width:3;
    stroke-dasharray:6 4;
    animation:beamFlow 1s linear infinite;
    pointer-events:none;
  }
  @keyframes beamFlow{
    0%{stroke-dashoffset:20;}
    100%{stroke-dashoffset:0;}
  }

  /* Floating Zoom HUD */
  .zoom-hud{
    position:absolute;
    bottom:16px;
    left:16px;
    display:flex;
    flex-direction:column;
    gap:6px;
    z-index:30;
    background:rgba(18, 25, 36, 0.85);
    border:1px solid var(--line);
    border-radius:12px;
    padding:6px;
    backdrop-filter:blur(10px);
    box-shadow:0 8px 24px rgba(0,0,0,0.6);
  }
  .zoom-hud-btn{
    width:36px;
    height:36px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel-light);
    color:var(--ink);
    font-size:18px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .15s, transform .1s, color .15s;
    user-select:none;
  }
  .zoom-hud-btn:hover{background:rgba(201,164,92,0.25);color:var(--gold);}
  .zoom-hud-btn:active{transform:scale(0.92);}
  .zoom-hud-label{
    font-size:10px;
    text-align:center;
    color:var(--ink-dim);
    font-family:'Cairo',sans-serif;
    font-weight:700;
    line-height:1;
    padding:2px 0;
  }

  /* Spectator Live Banner */
  .live-spectator-banner{
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(18, 25, 36, 0.95);
    border:1.5px solid var(--gold);
    border-radius:30px;
    padding:8px 20px;
    z-index:28;
    backdrop-filter:blur(12px);
    box-shadow:0 8px 30px rgba(0,0,0,0.8);
    display:flex;
    align-items:center;
    gap:12px;
    animation:fadeSlideUp .3s ease forwards;
  }

  /* Challenge / Action Floating Modal */
  .floating-action-container{
    position:absolute;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    z-index:35;
    width:calc(100% - 32px);
    max-width:520px;
    pointer-events:auto;
  }
  .challenge-card{
    background:rgba(18, 25, 36, 0.96);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px 18px;
    box-shadow:0 12px 48px rgba(0,0,0,0.85);
    backdrop-filter:blur(16px);
    text-align:center;
    animation:fadeSlideUp .25s ease forwards;
  }
  .challenge-hint{
    font-size:13px;
    color:var(--ink-dim);
    margin:0 0 8px;
  }
  .challenge-matchup{
    display:flex;
    align-items:stretch;
    justify-content:center;
    gap:10px;
    margin-bottom:14px;
  }
  .team-challenge-box{
    flex:1;
    border-radius:12px;
    padding:10px 8px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .team-challenge-role{
    font-size:10px;
    font-weight:900;
    font-family:'Cairo',sans-serif;
    padding:2px 8px;
    border-radius:99px;
    margin-bottom:4px;
    text-transform:uppercase;
  }
  .team-challenge-name{
    font-family:'Cairo',sans-serif;
    font-weight:900;
    font-size:clamp(14px, 3.5vw, 17px);
    line-height:1.2;
  }
  .team-challenge-galaxy{
    font-size:11px;
    opacity:0.85;
    margin-top:2px;
  }
  .vs-badge-circle{
    width:36px;
    height:36px;
    border-radius:50%;
    background:var(--panel);
    border:2px solid var(--gold);
    color:var(--gold);
    font-family:'Cairo',sans-serif;
    font-weight:900;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    align-self:center;
    flex-shrink:0;
    box-shadow:0 0 16px rgba(201,164,92,0.4);
  }

  .winner-picker-title{
    font-family:'Cairo',sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--gold);
    margin-bottom:10px;
  }
  .team-win-buttons{
    display:flex;
    gap:10px;
    margin-bottom:8px;
  }
  .team-win-btn{
    flex:1;
    padding:12px 8px;
    border:none;
    border-radius:10px;
    font-family:'Cairo',sans-serif;
    font-weight:900;
    font-size:clamp(13px, 3.5vw, 15px);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:transform .1s, filter .15s, box-shadow .15s;
  }
  .team-win-btn:hover{filter:brightness(1.15);transform:translateY(-2px);}
  .team-win-btn:active{transform:scale(0.97);}

  .flash-alert{
    font-size:12px;
    color:#f87171;
    margin-top:6px;
    background:rgba(239,68,68,0.1);
    padding:6px 10px;
    border-radius:6px;
  }

  .overlay{position:fixed;inset:0;background:rgba(4,6,12,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;overflow-y:auto;}
  .overlay .card{max-width:440px;text-align:center;}

  @keyframes victoryPulse{
    from{transform:scale(1);text-shadow:0 0 30px currentColor;}
    to{transform:scale(1.05);text-shadow:0 0 70px currentColor, 0 0 120px currentColor;}
  }
  @keyframes starBounce{
    from{transform:translateY(0) rotate(-5deg);opacity:0.8;}
    to{transform:translateY(-10px) rotate(5deg);opacity:1;}
  }
  @keyframes fadeSlideUp{
    from{opacity:0;transform:translateY(16px);}
    to{opacity:1;transform:translateY(0);}
  }
  .victory-wrap{animation:fadeSlideUp .6s ease forwards;}

  @media (max-width:600px){
    .topbar{padding:4px 8px;}
    .score-pill{font-size:11px;padding:3px 6px;}
    .score-btn{width:18px;height:18px;font-size:11px;}
    .zoom-hud{bottom:10px;left:10px;}
    .zoom-hud-btn{width:32px;height:32px;font-size:16px;}
    .floating-action-container{bottom:10px;width:calc(100% - 20px);}
    .challenge-card{padding:12px 14px;}
  }
</style>

function safeGet(key){ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; } }
function safeSet(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; } }
function safeSessionGet(key){ try{ const v=sessionStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; } }
function safeSessionSet(key,val){ try{ sessionStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; } }

const ADMIN_PASSWORD = 'Gravity2026';
let IS_ADMIN = !!safeSessionGet('galaxy_admin');

// Utility: get contrasting high-legibility text color (black or white)
function getContrastColor(hexColor) {
  if(!hexColor) return '#ffffff';
  let hex = hexColor.replace('#', '');
  if(hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
  const r = parseInt(hex.substr(0,2), 16) || 0;
  const g = parseInt(hex.substr(2,2), 16) || 0;
  const b = parseInt(hex.substr(4,2), 16) || 0;
  const yiq = ((r*299) + (g*587) + (b*114)) / 1000;
  return (yiq >= 145) ? '#0a0e17' : '#ffffff';
}

/* ============================= MAP GENERATION ============================= */
function buildWorld(){
  const regions = {};
  const ids = [];
  const adj = {};
  
  const types = ['planet', 'planet', 'planet', 'moon', 'moon', 'star'];
  const quadrants = [
    {cx: 200, cy: 150}, // 0: Top-Left  (Team 0)
    {cx: 600, cy: 150}, // 1: Top-Right (Team 1)
    {cx: 200, cy: 450}, // 2: Bottom-Left (Team 2)
    {cx: 600, cy: 450}  // 3: Bottom-Right (Team 3)
  ];
  const numPerQuad = 10;
  
  quadrants.forEach((q, qIdx) => {
    for(let i=0; i<numPerQuad; i++){
      let x, y;
      let valid = false;
      for(let attempt=0; attempt<100; attempt++){
        x = q.cx - 150 + Math.random()*300;
        y = q.cy - 120 + Math.random()*240;
        valid = true;
        for(let j=0; j<ids.length; j++){
          const other = regions[ids[j]];
          if(Math.hypot(x-other.x, y-other.y) < 45) { valid = false; break; }
        }
        if(valid) break;
      }
      const t = types[Math.floor(Math.random()*types.length)];
      const r = t==='star'? 24 + Math.random()*8 : t==='planet'? 16 + Math.random()*6 : 9 + Math.random()*4;
      
      const id = 'body-'+qIdx+'-'+i;
      ids.push(id);
      regions[id] = { id, x, y, r, type: t, quadrant: qIdx };
      adj[id] = new Set();
    }
  });
  
  // Connect within quadrants
  ids.forEach(id1 => {
    const b1 = regions[id1];
    const dists = [];
    ids.forEach(id2 => {
      if(id1!==id2 && regions[id2].quadrant === b1.quadrant){
        const b2 = regions[id2];
        dists.push({id: id2, d: Math.hypot(b1.x-b2.x, b1.y-b2.y)});
      }
    });
    dists.sort((a,b)=>a.d - b.d);
    for(let i=0; i<2; i++){
      if(dists[i] && dists[i].d < 160){
        adj[id1].add(dists[i].id);
        adj[dists[i].id].add(id1);
      }
    }
  });

  // Cross-quadrant wormholes
  const links = [[0,1], [0,2], [1,3], [2,3]];
  links.forEach(([q1, q2]) => {
    const bodies1 = ids.filter(id => regions[id].quadrant === q1);
    const bodies2 = ids.filter(id => regions[id].quadrant === q2);
    let best = null;
    let minDist = Infinity;
    bodies1.forEach(b1 => {
      bodies2.forEach(b2 => {
        const d = Math.hypot(regions[b1].x-regions[b2].x, regions[b1].y-regions[b2].y);
        if(d < minDist) { minDist = d; best = [b1, b2]; }
      });
    });
    if(best){
      adj[best[0]].add(best[1]);
      adj[best[1]].add(best[0]);
    }
  });

  return { regions, adj, ids };
}
const WORLD = buildWorld();

/* ============================= STORAGE ============================= */
const INDEX_KEY = 'realm-battles-index';
let BATTLES_CACHE = safeGet(INDEX_KEY) || [];
let boardListenerRef = null;

function detachBoardListener(){
  if(boardListenerRef){ boardListenerRef.off('value'); boardListenerRef = null; }
}

function attachBattlesListener(){
  if(!db) return;
  db.ref('battles').on('value', snap=>{
    const val = snap.val() || {};
    BATTLES_CACHE = Object.keys(val).map(k=>{
      const b = val[k];
      return {id:b.id, name:b.name, teams:b.teams ? b.teams.map(t=>t.name) : [], updatedAt:b.updatedAt||0, winner: b.winner===undefined?null:b.winner};
    }).sort((a,b)=>b.updatedAt-a.updatedAt);
    safeSet(INDEX_KEY, BATTLES_CACHE);
    if(VIEW==='landing' || VIEW==='list') render();
  });
}

async function saveBattle(state){
  if(!state) return;
  state.updatedAt = Date.now();
  try{ localStorage.setItem('realm-battle:'+state.id, JSON.stringify(state)); }catch(e){}
  if(db){
    try{ await db.ref('battles/'+state.id).set(state); }catch(e){ console.error(e); }
  }
}
async function loadBattleLocal(id){ try{ const r=localStorage.getItem('realm-battle:'+id); return r?JSON.parse(r):null; }catch(e){ return null; } }
async function deleteBattleEverywhere(id){
  try{ localStorage.removeItem('realm-battle:'+id); }catch(e){}
  if(db){ try{ await db.ref('battles/'+id).remove(); }catch(e){} }
}

async function enterBoardView(id, editable){
  detachBoardListener();
  BOARD_EDITABLE = editable;
  let g = null;
  if(db){
    try{ const snap = await db.ref('battles/'+id).once('value'); g = snap.val(); }catch(e){}
  }
  if(!g) g = await loadBattleLocal(id);
  if(!g){ alert('المعركة دي مش موجودة أو اتحذفت.'); VIEW = editable ? 'adminHome' : 'landing'; render(); return; }
  if(g.winner===undefined) g.winner=null;
  if(Array.isArray(g.teams)) g.teams.forEach(t=>{ if(typeof t.score!=='number') t.score=0; if(typeof t.gamesPlayed!=='number') t.gamesPlayed=0; });
  if(!Array.isArray(g.log)) g.log=[];
  GAME = g; 
  SEL={attacker:null,defender:null};
  SHOW_END_PICKER=false; FLASH=null;
  resetViewTransform();
  VIEW='board'; render();
  
  if(!editable && db){
    boardListenerRef = db.ref('battles/'+id);
    boardListenerRef.on('value', snap=>{
      const v = snap.val();
      if(v){
        if(v.winner===undefined) v.winner=null;
        if(Array.isArray(v.teams)) v.teams.forEach(t=>{ if(typeof t.score!=='number') t.score=0; if(typeof t.gamesPlayed!=='number') t.gamesPlayed=0; });
        if(!Array.isArray(v.log)) v.log=[];
      }
      if(v && VIEW==='board' && !BOARD_EDITABLE){ 
        GAME = v; 
        render();
      }
    });
  }
}

/* ============================= APP STATE ============================= */
let VIEW = IS_ADMIN ? 'adminHome' : 'landing';
let SETUP={ names:[{team:'', galaxy:''}, {team:'', galaxy:''}, {team:'', galaxy:''}, {team:'', galaxy:''}] };
let GAME=null;
let BOARD_EDITABLE=true;
let SEL={ attacker:null, defender:null };
let FLASH=null;
let SHOW_END_PICKER=false;
let HISTORY=[]; // undo stack

// الأخضر، الأحمر، الأزرق، الأصفر
const TEAM_COLORS=['#22C55E','#EF4444','#3B82F6','#EAB308'];
const root=document.getElementById('app');
function uid(){ return 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ============================= ZOOM & PAN SYSTEM ============================= */
let MAP_VIEW = {
  zoom: 1.0,
  panX: 0,
  panY: 0
};
const BASE_W = 800;
const BASE_H = 600;

function resetViewTransform(){
  MAP_VIEW.zoom = 1.0;
  MAP_VIEW.panX = 0;
  MAP_VIEW.panY = 0;
  applySvgViewBox();
}

function adjustZoom(delta, pivotX, pivotY){
  const oldZoom = MAP_VIEW.zoom;
  let newZoom = Math.min(Math.max(oldZoom + delta, 0.75), 4.5);
  newZoom = Math.round(newZoom * 100) / 100;
  if(newZoom === oldZoom) return;

  if(pivotX === undefined) pivotX = BASE_W / 2;
  if(pivotY === undefined) pivotY = BASE_H / 2;

  const curW = BASE_W / oldZoom;
  const curH = BASE_H / oldZoom;
  const newW = BASE_W / newZoom;
  const newH = BASE_H / newZoom;

  const relX = (pivotX - MAP_VIEW.panX) / curW;
  const relY = (pivotY - MAP_VIEW.panY) / curH;

  MAP_VIEW.panX = pivotX - relX * newW;
  MAP_VIEW.panY = pivotY - relY * newH;
  MAP_VIEW.zoom = newZoom;
  applySvgViewBox();
  updateZoomHud();
}

function applySvgViewBox(){
  const svg = document.getElementById('map');
  if(!svg) return;
  const w = BASE_W / MAP_VIEW.zoom;
  const h = BASE_H / MAP_VIEW.zoom;
  svg.setAttribute('viewBox', `${MAP_VIEW.panX} ${MAP_VIEW.panY} ${w} ${h}`);
}

function updateZoomHud(){
  const lbl = document.getElementById('zoom-pct-label');
  if(lbl) lbl.textContent = Math.round(MAP_VIEW.zoom * 100) + '%';
}

/* ============================= GAME LOGIC ============================= */
function newGameState(name, setups){
  const teams = setups.map((s,i)=>({
    id:i, 
    name:s.team||('الفريق '+(i+1)), 
    galaxyName:s.galaxy||('مجرة '+(i+1)), 
    color:TEAM_COLORS[i], 
    eliminated:false,
    score:0,
    gamesPlayed:0
  }));
  const regions={};
  WORLD.ids.forEach(id=>{
    const r = WORLD.regions[id];
    regions[id] = r.quadrant; 
  });
  return {
    id: uid(), 
    name: name || 'حرب المجرات العظمى',
    teams, regions,
    log: ['بدأت المعركة!'],
    winner: null,
    activeChallenge: null
  };
}
function ownedBy(state, teamId){ return [...WORLD.ids, ...(state.extraPlanets ? Object.keys(state.extraPlanets) : [])].filter(id=>state.regions[id]===teamId); }
function checkElimination(state){ state.teams.forEach(t=>{ if(!t.eliminated && ownedBy(state,t.id).length===0) t.eliminated=true; }); }

function saveSnapshot(){
  if(!GAME) return;
  HISTORY.push(JSON.stringify({ regions: GAME.regions, log: [...GAME.log], teams: JSON.parse(JSON.stringify(GAME.teams)), extraPlanets: GAME.extraPlanets ? {...GAME.extraPlanets} : {} }));
  if(HISTORY.length > 30) HISTORY.shift();
}

function undoStep(){
  if(!BOARD_EDITABLE || HISTORY.length===0) return;
  const snap = JSON.parse(HISTORY.pop());
  GAME.regions = snap.regions;
  GAME.log = snap.log;
  GAME.teams = snap.teams;
  GAME.extraPlanets = snap.extraPlanets || {};
  GAME.activeChallenge = null;
  SEL={attacker:null,defender:null};
  saveBattle(GAME); render();
}

function adjustScore(teamId, delta){
  if(!BOARD_EDITABLE) return;
  const state = GAME;
  const t = state.teams[teamId];
  if(!state.extraPlanets) state.extraPlanets = {};
  saveSnapshot();
  
  if(delta > 0) {
    const q = t.id;
    const quadCenters = [{cx:200,cy:150},{cx:600,cy:150},{cx:200,cy:450},{cx:600,cy:450}];
    const qc = quadCenters[q];
    let x, y;
    let placed = false;
    for(let attempt=0; attempt<200; attempt++){
      x = qc.cx - 160 + Math.random()*320;
      y = qc.cy - 130 + Math.random()*260;
      const allIds = [...WORLD.ids, ...Object.keys(state.extraPlanets)];
      const allRegions = {...WORLD.regions, ...state.extraPlanets};
      let ok = true;
      for(const oid of allIds){
        const o = allRegions[oid];
        if(o && Math.hypot(x-o.x, y-o.y) < 38){ ok=false; break; }
      }
      if(ok){ placed=true; break; }
    }
    if(!placed){ x = qc.cx + (Math.random()-0.5)*280; y = qc.cy + (Math.random()-0.5)*220; }
    const newId = 'extra-'+teamId+'-'+Date.now();
    state.extraPlanets[newId] = { id:newId, x, y, r: 14+Math.random()*6, type:'planet', quadrant:q, isExtra:true };
    state.regions[newId] = teamId;
    state.log.push(`🌍 كوكب جديد انضم لـ ${t.name}!`);
  } else if(delta < 0) {
    const owned = ownedBy(state, teamId);
    if(!owned.length) return;
    const extraOwned = owned.filter(id => state.extraPlanets && state.extraPlanets[id]);
    let target = null;
    if(extraOwned.length) {
      target = extraOwned[Math.floor(Math.random()*extraOwned.length)];
    } else {
      let edgeCands = owned.filter(id => {
        let isEdge = false;
        WORLD.adj[id] && WORLD.adj[id].forEach(adjId => { if(state.regions[adjId] !== teamId) isEdge=true; });
        return isEdge;
      });
      if(!edgeCands.length) edgeCands = owned;
      target = edgeCands[Math.floor(Math.random()*edgeCands.length)];
    }
    if(target){
      delete state.regions[target];
      if(state.extraPlanets && state.extraPlanets[target]) delete state.extraPlanets[target];
      state.log.push(`💥 منطقة من ${t.name} اختفت!`);
    }
  }
  
  checkElimination(state);
  saveBattle(state); render();
}

function declareWinner(state){
  let maxRegions = -1;
  let winnerId = null;
  state.teams.forEach(t=>{
    if(!t.eliminated){
      const cnt = ownedBy(state, t.id).length;
      if(cnt > maxRegions){ maxRegions = cnt; winnerId = t.id; }
    }
  });
  if(winnerId === null) winnerId = state.teams[0].id;
  state.winner = winnerId;
  state.activeChallenge = null;
  state.log.push(`🎉🏆 انتهت المسابقة! الفايز: ${state.teams[winnerId].name} بـ ${maxRegions} منطقة`);
  SHOW_END_PICKER=false;
  SEL={attacker:null,defender:null};
  saveBattle(state); render();
}

function render(){
  if(!IS_ADMIN){
    if(['adminHome','setup','list'].includes(VIEW)) VIEW='landing';
    if(VIEW==='board' && BOARD_EDITABLE) VIEW='landing';
  }
  if(VIEW!=='board') detachBoardListener();
  root.innerHTML='';
  if(VIEW==='landing') root.appendChild(renderLanding());
  else if(VIEW==='adminHome') root.appendChild(renderAdminHome());
  else if(VIEW==='list') root.appendChild(renderList());
  else if(VIEW==='setup') root.appendChild(renderSetup());
  else if(VIEW==='board') root.appendChild(renderBoard());
}

function renderSetup(){
  const wrap=el(`<div class="center-screen">
    <div class="brand" style="font-size:26px;">معركة المجرات الأربع</div>
    <div class="card" style="text-align:right;max-width:540px;">
      <label>اسم المعركة</label>
      <input type="text" id="battle-name" placeholder="مثال: حرب النجوم الكبرى" style="margin-bottom:16px;">

      <div id="team-inputs"></div>
      <div class="stack">
        <button class="btn" id="btn-start">ابدأ المعركة</button>
        <button class="btn secondary" id="btn-back2">رجوع</button>
      </div>
    </div>
  </div>`);
  const teamInputs=wrap.querySelector('#team-inputs');
  function drawTeamInputs(){
    teamInputs.innerHTML='';
    for(let i=0;i<4;i++){
      const row=el(`<div class="team-row" style="flex-wrap:wrap;">
        <span class="swatch" style="background:${TEAM_COLORS[i]};color:${TEAM_COLORS[i]};"></span>
        <input type="text" style="flex:1;min-width:130px;" placeholder="اسم الفريق ${i+1}" value="${SETUP.names[i].team}" data-type="team">
        <input type="text" style="flex:1;min-width:130px;" placeholder="اسم مجرته" value="${SETUP.names[i].galaxy}" data-type="galaxy">
      </div>`);
      row.querySelectorAll('input').forEach(inp => {
        inp.oninput=(e)=>{ 
          const t = e.target.getAttribute('data-type');
          SETUP.names[i][t]=e.target.value; 
        };
      });
      teamInputs.appendChild(row);
    }
  }
  drawTeamInputs();
  wrap.querySelector('#btn-back2').onclick=()=>{ VIEW='adminHome'; render(); };
  wrap.querySelector('#btn-start').onclick=async()=>{
    const battleName=wrap.querySelector('#battle-name').value.trim();
    GAME=newGameState(battleName, SETUP.names);
    HISTORY=[];
    SEL={attacker:null,defender:null};
    BOARD_EDITABLE=true;
    resetViewTransform();
    await saveBattle(GAME);
    VIEW='board'; render();
  };
  return wrap;
}

function svgMap(){
  const state=GAME;
  const allPlanetData = { ...WORLD.regions, ...(state.extraPlanets || {}) };
  
  let defs = `
    <defs>
      <radialGradient id="grad-overlay-star" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
        <stop offset="30%" stop-color="#fff" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="grad-overlay-planet" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#fff" stop-opacity="0.6"/>
        <stop offset="70%" stop-color="#000" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0.9"/>
      </radialGradient>
    </defs>
  `;
  
  let bgStars = '';
  for(let i=0; i<160; i++){
     const sx = (Math.sin(i*123.45)*0.5+0.5)*800;
     const sy = (Math.cos(i*321.54)*0.5+0.5)*600;
     bgStars += `<circle cx="${sx}" cy="${sy}" r="${(i%3)*0.5+0.6}" fill="#fff" opacity="${0.15+(i%5)*0.1}"/>`;
  }
  
  let links = '';
  const drawn = new Set();
  WORLD.ids.forEach(id1 => {
    WORLD.adj[id1].forEach(id2 => {
      const pair = [id1,id2].sort().join('|');
      if(!drawn.has(pair)){
        drawn.add(pair);
        const b1 = WORLD.regions[id1];
        const b2 = WORLD.regions[id2];
        links += `<line x1="${b1.x}" y1="${b1.y}" x2="${b2.x}" y2="${b2.y}" class="link"/>`;
      }
    });
  });

  // Active challenge beam
  let beam = '';
  const actAtk = SEL.attacker || (state.activeChallenge ? state.activeChallenge.atkId : null);
  const actDef = SEL.defender || (state.activeChallenge ? state.activeChallenge.defId : null);
  if(actAtk && actDef && allPlanetData[actAtk] && allPlanetData[actDef]){
    const p1 = allPlanetData[actAtk];
    const p2 = allPlanetData[actDef];
    const atkTeamId = state.regions[actAtk];
    const atkCol = (atkTeamId!==undefined && state.teams[atkTeamId]) ? state.teams[atkTeamId].color : '#c9a45c';
    beam = `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${atkCol}" class="attack-beam"/>`;
  }

  let bodies = '';
  const allPlanetIds = [...WORLD.ids, ...(state.extraPlanets ? Object.keys(state.extraPlanets) : [])];
  allPlanetIds.forEach(id=>{
    if(!(id in state.regions)) return;
    const r = allPlanetData[id];
    if(!r) return;
    const owner=state.regions[id];
    const team = owner !== null && owner !== undefined ? state.teams[owner] : null;
    const cls=['celestial'];
    if(BOARD_EDITABLE && state.winner===null) cls.push('clickable-region');
    if(actAtk===id) cls.push('sel-attacker');
    if(actDef===id) cls.push('sel-defender');
    
    const glowColor = team ? team.color : 'rgba(255,255,255,0.15)';
    const baseColor = team ? team.color : '#555';
    let overlayId = r.type==='star' ? 'grad-overlay-star' : 'grad-overlay-planet';
    
    bodies += `
      <g class="${cls.join(' ')}" data-id="${id}" style="transform-origin: ${r.x}px ${r.y}px">
        <circle cx="${r.x}" cy="${r.y}" r="${r.r+7}" class="celestial-glow" stroke="${glowColor}"/>
        <circle cx="${r.x}" cy="${r.y}" r="${r.r}" fill="${baseColor}"/>
        <circle cx="${r.x}" cy="${r.y}" r="${r.r}" fill="url(#${overlayId})" pointer-events="none"/>
      </g>
    `;
  });

  let galaxyLabels = '';
  if(state.teams.length === 4){
    const quads = [
      {cx:200, cy:150},
      {cx:600, cy:150},
      {cx:200, cy:450},
      {cx:600, cy:450}
    ];
    quads.forEach((q, i) => {
      const t = state.teams[i];
      const owned = ownedBy(state, i);
      let cx = q.cx, cy = q.cy;
      if(owned.length > 0){
        let sumX=0, sumY=0;
        owned.forEach(id=>{ const p=allPlanetData[id]; if(p){ sumX+=p.x; sumY+=p.y; } });
        cx = sumX/owned.length;
        cy = sumY/owned.length;
      }
      galaxyLabels += `
        <g style="pointer-events:none;">
          <text x="${cx}" y="${cy-12}" fill="#000" font-size="20" font-family="'Cairo',sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="middle" opacity="0.8" dx="1.5" dy="1.5">${t.galaxyName}</text>
          <text x="${cx}" y="${cy-12}" fill="${t.color}" font-size="20" font-family="'Cairo',sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="middle" opacity="1" filter="drop-shadow(0 0 8px ${t.color}88)">${t.galaxyName}</text>
          <text x="${cx}" y="${cy+14}" fill="#000" font-size="13" font-family="'Cairo',sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="middle" opacity="0.9" dx="1" dy="1">${t.name} (${owned.length} مناطق)</text>
          <text x="${cx}" y="${cy+14}" fill="#f1f5f9" font-size="13" font-family="'Cairo',sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="middle" opacity="0.95">${t.name} (${owned.length} مناطق)</text>
        </g>
      `;
    });
  }

  let supernova = '';
  if(state.winner !== null){
    const winnerColor = state.teams[state.winner].color;
    let maxId = WORLD.ids[0];
    WORLD.ids.forEach(id=>{ if(WORLD.regions[id].r > WORLD.regions[maxId].r) maxId = id; });
    const big = WORLD.regions[maxId];
    supernova = `
      <circle cx="${big.x}" cy="${big.y}" r="${big.r*4}" fill="${winnerColor}" opacity="0.15"/>
      <circle cx="${big.x}" cy="${big.y}" r="${big.r}" fill="${winnerColor}">
        <animate attributeName="r" values="${big.r};${big.r*2.6};${big.r}" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.95;0.25;0.95" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="${big.x}" cy="${big.y}" r="${big.r*1.5}" fill="none" stroke="${winnerColor}" stroke-width="3">
        <animate attributeName="r" values="${big.r*1.5};${big.r*4.5};${big.r*1.5}" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    `;
  }

  const curW = BASE_W / MAP_VIEW.zoom;
  const curH = BASE_H / MAP_VIEW.zoom;
  return `<svg id="map" viewBox="${MAP_VIEW.panX} ${MAP_VIEW.panY} ${curW} ${curH}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${defs}${bgStars}${links}${beam}${bodies}${supernova}${galaxyLabels}</svg>`;
}

    const total = ownedBy(state,t.id).length;
    const games = t.gamesPlayed || 0;

    const adjustBtns = BOARD_EDITABLE ? `
      <button class="score-btn" data-adj="-1" data-team="${t.id}" title="خصم كوكب">−</button>
      <button class="score-btn" data-adj="1" data-team="${t.id}" title="إضافة كوكب">+</button>` : '';

      <span class="dot" style="background:${t.color};color:${t.color};"></span>
      <span style="color:${t.color};">${t.name}:</span>
      <b>${total} مناطق</b>
      <span style="background:rgba(255,255,255,0.08);padding:1px 5px;border-radius:6px;font-size:10px;color:var(--ink-dim);">⚔️ ${games}</span>
      ${adjustBtns}
    </div>`;
  }).join('')}</div>`;

  const wrap=el(`<div id="board-screen">
    <div class="topbar">
      <div style="flex:1;min-width:0;">
        ${scoreBar}
      </div>
      <div class="btnrow">
        ${BOARD_EDITABLE && state.winner === null ? '<button class="btn small danger" id="btn-end-game">🏁 إنهاء</button>' : ''}
        ${BOARD_EDITABLE && state.winner === null ? `<button class="btn small secondary" id="btn-undo" ${HISTORY.length===0?'disabled':''}>↩ تراجع</button>` : ''}
        <button class="btn small secondary" id="btn-save-exit">${exitLabel}</button>
      </div>
    </div>
    <div class="main-area">
      <div class="map-wrap" id="map-container">
        ${svgMap()}
      </div>

      <!-- Floating Zoom HUD -->
      <div class="zoom-hud">
        <button class="zoom-hud-btn" id="btn-zoom-in" title="تكبير">+</button>
        <div class="zoom-hud-label" id="zoom-pct-label">${Math.round(MAP_VIEW.zoom*100)}%</div>
        <button class="zoom-hud-btn" id="btn-zoom-out" title="تصغير">−</button>
        <button class="zoom-hud-btn" id="btn-zoom-reset" title="إعادة ضبط الرؤية" style="font-size:14px;">⟲</button>
      </div>
    </div>
  </div>`);

  const mainArea = wrap.querySelector('.main-area');

  // Spectator challenge banner
  if(!BOARD_EDITABLE && state.activeChallenge && state.winner===null){
    const specBanner = renderSpectatorChallengeBanner(state);
    if(specBanner) mainArea.appendChild(specBanner);
  }

  // Admin floating action panel
  if(BOARD_EDITABLE && state.winner===null){
    const floatingEl = renderFloatingAction(state);
    if(floatingEl) mainArea.appendChild(floatingEl);
  }

  // Score adjustments
  wrap.querySelectorAll('[data-adj]').forEach(btn=>{
    btn.onclick=()=>adjustScore(parseInt(btn.getAttribute('data-team')), parseInt(btn.getAttribute('data-adj')));
  });

  wrap.querySelector('#btn-save-exit').onclick=async()=>{
    if(BOARD_EDITABLE){ 
      GAME.activeChallenge = null;
      await saveBattle(GAME); 
      VIEW='adminHome'; 
    } else { 
      VIEW='landing'; 
    }
    HISTORY=[];
    render();
  };

  if(BOARD_EDITABLE && state.winner === null){
    const btnEnd = wrap.querySelector('#btn-end-game');
    if(btnEnd){ btnEnd.onclick = () => { SHOW_END_PICKER=true; render(); }; }
    const btnUndo = wrap.querySelector('#btn-undo');
    if(btnUndo){ btnUndo.onclick = () => undoStep(); }
  }

  // Zoom HUD actions
  wrap.querySelector('#btn-zoom-in').onclick = () => adjustZoom(0.3);
  wrap.querySelector('#btn-zoom-out').onclick = () => adjustZoom(-0.3);
  wrap.querySelector('#btn-zoom-reset').onclick = () => resetViewTransform();

  // Attach interactive pan & zoom gestures
  initMapGestures(wrap.querySelector('#map-container'));

  if(SHOW_END_PICKER) { wrap.appendChild(renderEndPickerOverlay(state)); }
  if(state.winner!==null){ wrap.appendChild(renderVictoryOverlay(state)); }
  return wrap;
}

function renderSpectatorChallengeBanner(state){
  const ch = state.activeChallenge;
  if(!ch) return null;
  const t1 = state.teams[ch.atkTeamId];
  const t2 = state.teams[ch.defTeamId];
  if(!t1 || !t2) return null;
  return el(`<div class="live-spectator-banner">
    <div style="font-size:18px;">⚔️</div>
    <div style="display:flex;align-items:center;gap:6px;font-family:'Cairo';font-weight:900;font-size:14px;">
      <span style="color:${t1.color};">${t1.name} (${t1.galaxyName})</span>
      <span style="color:var(--gold);">ضد</span>
      <span style="color:${t2.color};">${t2.name} (${t2.galaxyName})</span>
    </div>
  </div>`);
}

function renderFloatingAction(state){

      <div class="challenge-card" style="padding:10px 16px;">
        <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
          <span style="font-size:18px;">🎯</span>
          <span style="font-size:13px;font-weight:700;color:var(--ink);">اضغط على كوكب في الخريطة لاختيار المهاجم</span>
        </div>
      </div>
    `;
  } else if(!SEL.defender){
    const atkTeamId = state.regions[SEL.attacker];
    const atkTeam = state.teams[atkTeamId];
    innerHTML = `
      <div class="challenge-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="dot" style="background:${atkTeam.color};color:${atkTeam.color};"></span>
            <span style="font-family:'Cairo';font-weight:900;color:${atkTeam.color};font-size:15px;">${atkTeam.name} (${atkTeam.galaxyName})</span>
          </div>
          <button class="btn secondary small" id="btn-cancel-atk" style="width:auto;padding:3px 10px;">إلغاء</button>
        </div>
        <div class="challenge-hint">الآن اضغط على كوكب من مجرة ثانية لتحديه ⚔️</div>
        ${FLASH ? `<div class="flash-alert">${FLASH}</div>` : ''}
      </div>
    `;
  } else {
    const atkTeamId = state.regions[SEL.attacker];
    const defTeamId = state.regions[SEL.defender];
    const atkTeam = state.teams[atkTeamId];
    const defTeam = (defTeamId !== null && defTeamId !== undefined) ? state.teams[defTeamId] : null;
    const defColor = defTeam ? defTeam.color : '#94a3b8';
    const defName = defTeam ? defTeam.name : 'منطقة محايدة';
    const defGalaxy = defTeam ? defTeam.galaxyName : 'فضاء حر';

    const atkTextColor = getContrastColor(atkTeam.color);
    const defTextColor = getContrastColor(defColor);

    innerHTML = `
      <div class="challenge-card">
        <!-- Matchup Display with Team Colors -->
        <div class="challenge-matchup">
          <!-- Attacker Box -->
          <div class="team-challenge-box" style="background: linear-gradient(135deg, ${atkTeam.color}25, ${atkTeam.color}45); border: 2px solid ${atkTeam.color}; box-shadow: 0 0 16px ${atkTeam.color}40;">
            <span class="team-challenge-role" style="background:${atkTeam.color}; color:${atkTextColor};">المهاجم 🚀</span>
            <span class="team-challenge-name" style="color:${atkTeam.color};">${atkTeam.name}</span>
            <span class="team-challenge-galaxy" style="color:var(--ink);">${atkTeam.galaxyName}</span>
          </div>

          <div class="vs-badge-circle">VS</div>

          <!-- Defender Box -->
          <div class="team-challenge-box" style="background: linear-gradient(135deg, ${defColor}25, ${defColor}45); border: 2px solid ${defColor}; box-shadow: 0 0 16px ${defColor}40;">
            <span class="team-challenge-role" style="background:${defColor}; color:${defTextColor};">المدافع 🛡️</span>
            <span class="team-challenge-name" style="color:${defColor};">${defName}</span>
            <span class="team-challenge-galaxy" style="color:var(--ink);">${defGalaxy}</span>
          </div>
        </div>

        <div class="winner-picker-title">مين اللي فاز في التحدي؟ 👇</div>

        <!-- Buttons with exact team colors -->
        <div class="team-win-buttons">
          <button class="team-win-btn" id="btn-win-atk" style="background:${atkTeam.color}; color:${atkTextColor}; box-shadow:0 4px 18px ${atkTeam.color}60;">
            🏆 فاز ${atkTeam.name}
          </button>
          <button class="team-win-btn" id="btn-win-def" style="background:${defColor}; color:${defTextColor}; box-shadow:0 4px 18px ${defColor}60;">
            ${defTeam ? `🏆 فاز ${defTeam.name}` : `🛡️ صد الهجوم`}

function resolveAttack(state, attackerWon){
  if(!SEL.attacker || !SEL.defender) return;
  const atkTeamId = state.regions[SEL.attacker];
  const defTeamId = state.regions[SEL.defender];
  const atkTeam = state.teams[atkTeamId];
  const defTeam = (defTeamId !== null && defTeamId !== undefined) ? state.teams[defTeamId] : null;
  
  if(!atkTeam) return;

  saveSnapshot();
  atkTeam.gamesPlayed = (atkTeam.gamesPlayed || 0) + 1;
  if(defTeam){
    defTeam.gamesPlayed = (defTeam.gamesPlayed || 0) + 1;
  }

  const winnerTeamId = attackerWon ? atkTeamId : defTeamId;
  const loserTeamId = attackerWon ? defTeamId : atkTeamId;
  const winnerTeam = (winnerTeamId !== null && winnerTeamId !== undefined) ? state.teams[winnerTeamId] : null;
  const loserTeam = (loserTeamId !== null && loserTeamId !== undefined) ? state.teams[loserTeamId] : null;

  if(winnerTeam && loserTeam && winnerTeamId !== loserTeamId){
    // Primary region to capture
    const primaryRegion = attackerWon ? SEL.defender : SEL.attacker;
    state.regions[primaryRegion] = winnerTeamId;
    let capturedCount = 1;

    // Find a second region owned by the loser to transfer to the winner
    const loserOwned = ownedBy(state, loserTeamId).filter(id => id !== primaryRegion);
    if(loserOwned.length > 0){
      const extraOwned = loserOwned.filter(id => state.extraPlanets && state.extraPlanets[id]);
      let secondId = null;
      if(extraOwned.length > 0){
        secondId = extraOwned[Math.floor(Math.random() * extraOwned.length)];
      } else {
        let edgeCands = loserOwned.filter(id => {
          let isEdge = false;
          if(WORLD.adj[id]) WORLD.adj[id].forEach(a => { if(state.regions[a] !== loserTeamId) isEdge = true; });
          return isEdge;
        });
        if(!edgeCands.length) edgeCands = loserOwned;
        secondId = edgeCands[Math.floor(Math.random() * edgeCands.length)];
      }

      if(secondId){
        state.regions[secondId] = winnerTeamId;
        capturedCount = 2;
      }
    }

    state.log.push(`🏆 فاز ${winnerTeam.name} وسيطر على ${capturedCount === 2 ? 'منطقتين' : 'منطقة'} من ${loserTeam.name}!`);
  } else if(attackerWon) {
    state.regions[SEL.defender] = atkTeamId;
    state.log.push(`🏆 استولى ${atkTeam.name} على منطقة جديدة!`);
  } else {
    state.log.push(`🛡 صد ${defTeam ? defTeam.name : 'الفريق'} التحدي بنجاح`);
  }

  SEL={attacker:null,defender:null};
  state.activeChallenge = null;
  checkElimination(state);
  saveBattle(state); 
  render();
}

function handleRegionClick(id){
  if(!BOARD_EDITABLE) return;
  const state=GAME;
  if(!state || state.winner!==null) return;

  if(!SEL.attacker){
    SEL.attacker=id; FLASH=null; 
    state.activeChallenge = null;
    render(); return;
  }
  if(SEL.attacker===id){ 
    SEL={attacker:null,defender:null}; 
    state.activeChallenge = null;
    render(); return; 
  }
  if(!SEL.defender){
    if(state.regions[id]!==null && state.regions[id]!==undefined && state.regions[id]===state.regions[SEL.attacker]){
      FLASH='المنطقتين من نفس الفريق! اختار كوكب من مجرة تانية للتحدي.'; 
      render(); return;
    }
    SEL.defender=id; FLASH=null;
    // Broadcast active challenge to spectators
    state.activeChallenge = {
      atkId: SEL.attacker,
      defId: SEL.defender,
      atkTeamId: state.regions[SEL.attacker],
      defTeamId: state.regions[SEL.defender]
    };
    saveBattle(state);
    render(); return;
  }
  SEL={attacker:id, defender:null}; 
  state.activeChallenge = null;
  FLASH=null; render();
}

/* ============================= PAN & ZOOM GESTURES ============================= */
function initMapGestures(container){
  if(!container) return;
  const svg = container.querySelector('#map');
  if(!svg) return;

  let isDragging = false;
  let startX = 0, startY = 0;
  let origPanX = 0, origPanY = 0;
  let movedDist = 0;
  let initialPinchDist = null;
  let initialZoom = 1;

  // Direct Click on planets
  svg.querySelectorAll('.clickable-region').forEach(node=>{
    node.onclick = (e) => {
      e.stopPropagation();
      if(movedDist < 8){
        handleRegionClick(node.getAttribute('data-id'));
      }
    };
  });

  function getTouchDistance(touches){
    return Math.hypot(
      touches[0].clientX - touches[1].clientX,
      touches[0].clientY - touches[1].clientY
    );
  }

  function getTouchMidpoint(touches){
    return {
      x: (touches[0].clientX + touches[1].clientX)/2,
      y: (touches[0].clientY + touches[1].clientY)/2
    };
  }

  // Mouse wheel zoom
  container.onwheel = (e) => {
    e.preventDefault();
    const rect = container.getBoundingClientRect();
    const cursorSvgX = MAP_VIEW.panX + ((e.clientX - rect.left) / rect.width) * (BASE_W / MAP_VIEW.zoom);
    const cursorSvgY = MAP_VIEW.panY + ((e.clientY - rect.top) / rect.height) * (BASE_H / MAP_VIEW.zoom);
    const delta = e.deltaY < 0 ? 0.2 : -0.2;
    adjustZoom(delta, cursorSvgX, cursorSvgY);
  };

  // Touch Start
  container.ontouchstart = (e) => {
    if(e.touches.length === 1){
      isDragging = true;
      movedDist = 0;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      origPanX = MAP_VIEW.panX;
      origPanY = MAP_VIEW.panY;
      initialPinchDist = null;
    } else if(e.touches.length === 2){
      isDragging = false;
      initialPinchDist = getTouchDistance(e.touches);
      initialZoom = MAP_VIEW.zoom;
    }
  };

  // Touch Move
  container.ontouchmove = (e) => {
    if(e.touches.length === 1 && isDragging){
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      movedDist = Math.hypot(dx, dy);
      const rect = container.getBoundingClientRect();
      const scaleFactor = (BASE_W / MAP_VIEW.zoom) / rect.width;
      MAP_VIEW.panX = origPanX - dx * scaleFactor;
      MAP_VIEW.panY = origPanY - dy * scaleFactor;
      applySvgViewBox();
    } else if(e.touches.length === 2 && initialPinchDist){
      const newDist = getTouchDistance(e.touches);
      const zoomFactor = newDist / initialPinchDist;
      const rect = container.getBoundingClientRect();
      const mid = getTouchMidpoint(e.touches);
      const midSvgX = MAP_VIEW.panX + ((mid.x - rect.left) / rect.width) * (BASE_W / MAP_VIEW.zoom);
      const midSvgY = MAP_VIEW.panY + ((mid.y - rect.top) / rect.height) * (BASE_H / MAP_VIEW.zoom);
      
      let targetZoom = Math.min(Math.max(initialZoom * zoomFactor, 0.75), 4.5);
      MAP_VIEW.zoom = targetZoom;
      applySvgViewBox();
      updateZoomHud();
    }
  };

  // Touch End
  container.ontouchend = () => {
    isDragging = false;
    initialPinchDist = null;
  };

  // Mouse Drag
  container.onmousedown = (e) => {
    if(e.button !== 0) return;
    isDragging = true;
    movedDist = 0;
    startX = e.clientX;
    startY = e.clientY;
    origPanX = MAP_VIEW.panX;
    origPanY = MAP_VIEW.panY;
  };

  container.onmousemove = (e) => {
    if(!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    movedDist = Math.hypot(dx, dy);
    const rect = container.getBoundingClientRect();
    const scaleFactor = (BASE_W / MAP_VIEW.zoom) / rect.width;
    MAP_VIEW.panX = origPanX - dx * scaleFactor;
    MAP_VIEW.panY = origPanY - dy * scaleFactor;
    applySvgViewBox();
  };

  container.onmouseup = () => {
    isDragging = false;
  };

  container.onmouseleave = () => {
    isDragging = false;
  };
}

function renderEndPickerOverlay(state){
  let counts = state.teams.filter(t=>!t.eliminated).map(t=>({ t, cnt: ownedBy(state, t.id).length }));
  counts.sort((a,b)=>b.cnt-a.cnt);
  const overlay=el(`<div class="overlay"><div class="card">
    <div class="brand" style="font-size:24px;">🏁 إنهاء المسابقة</div>
    <p style="color:var(--ink-dim);margin-bottom:16px;">الترتيب الحالي حسب عدد المناطق:</p>
    <div class="stack" style="margin-bottom:16px;">
      ${counts.map((c,idx)=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel-light);border-radius:8px;border:1px solid ${c.t.color}44;">
        <span style="font-family:'Cairo';font-weight:900;font-size:16px;color:var(--gold);">#${idx+1}</span>
        <span class="dot" style="background:${c.t.color};color:${c.t.color};"></span>
        <span style="flex:1;font-weight:700;color:${c.t.color};">${c.t.name}</span>
        <span style="color:var(--ink-dim);">${c.cnt} مناطق · ⚔️ ${c.t.gamesPlayed||0}</span>
      </div>`).join('')}
    </div>
    <p style="color:var(--ink-dim);font-size:13px;margin-bottom:16px;">الفائز: <b style="color:${counts[0]?.t.color}">${counts[0]?.t.name} (${counts[0]?.t.galaxyName})</b></p>
    <div class="btnrow" style="gap:10px;">
      <button class="btn danger" id="btn-confirm-end">✅ تأكيد الإنهاء</button>
      <button class="btn secondary" id="btn-cancel-end">إلغاء</button>
    </div>
  </div></div>`);
  overlay.querySelector('#btn-confirm-end').onclick=()=>declareWinner(state);
  overlay.querySelector('#btn-cancel-end').onclick=()=>{ SHOW_END_PICKER=false; render(); };
  return overlay;
}

function renderVictoryOverlay(state){
  const winner = state.teams[state.winner];
  const winnerRegions = ownedBy(state, state.winner).length;
  const ranking = [...state.teams].sort((a,b) => ownedBy(state,b.id).length - ownedBy(state,a.id).length);
  const medals = ['🥇','🥈','🥉','4⃣'];

  const rankRows = ranking.map((t, i) => {
    const cnt = ownedBy(state, t.id).length;
    const isWinner = t.id === state.winner;
    return `<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;
      background:${isWinner ? t.color+'28' : 'rgba(255,255,255,0.03)'};
      border:1px solid ${isWinner ? t.color+'55' : 'rgba(255,255,255,0.06)'};
      margin-bottom:6px;">
      <span style="font-size:22px;width:28px;text-align:center;">${medals[i]||''}</span>
      <span style="width:12px;height:12px;border-radius:50%;background:${t.color};flex:0 0 12px;"></span>
      <span style="flex:1;font-family:'Cairo';font-weight:700;font-size:14px;text-align:right;color:${t.color};">${t.name} — ${t.galaxyName}</span>
      <span style="font-family:'Cairo';font-size:13px;color:${isWinner ? t.color : 'var(--ink-dim)'};
        font-weight:${isWinner ? '900' : '400'}">${cnt} مناطق · ⚔️ ${t.gamesPlayed||0}</span>
    </div>`;
  }).join('');

  const overlay = el(`<div class="overlay">
    <div class="victory-wrap" style="text-align:center;padding:30px 20px 24px;max-width:520px;width:100%;">
      <div style="font-size:38px;letter-spacing:6px;margin-bottom:10px;
        animation:starBounce 1.1s ease-in-out infinite alternate;">⭐🎉⭐</div>

      <div style="font-family:'Cairo',sans-serif;font-weight:900;
        font-size:clamp(54px,12vw,86px);line-height:1;
        color:${winner.color};
        animation:victoryPulse 1.3s ease-in-out infinite alternate;
        text-shadow:0 0 40px ${winner.color}77, 0 4px 0 rgba(0,0,0,.7);
        margin-bottom:14px;">مبروووك!</div>

      <div style="font-family:'Cairo',sans-serif;font-weight:900;
        font-size:clamp(26px,7vw,46px);
        color:#fff;
        text-shadow:0 0 24px ${winner.color}88;
        margin-bottom:4px;">🏆 ${winner.galaxyName} 🏆</div>

      <div style="font-size:16px;color:${winner.color};font-family:'Cairo';font-weight:700;margin-bottom:4px;">${winner.name}</div>
      <div style="font-size:14px;color:var(--ink-dim);margin-bottom:24px;">
        سيطر على <b style="color:${winner.color};">${winnerRegions}</b> مناطق فضائية
      </div>

      <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
        border-radius:14px;padding:14px;margin-bottom:20px;text-align:right;">
        <div style="font-family:'Cairo';font-weight:700;font-size:13px;color:var(--gold);
          margin-bottom:10px;text-align:center;">🎖️ الترتيب النهائي</div>
        ${rankRows}
      </div>

      <button class="btn" id="btn-menu-home"
        style="background:${winner.color};color:${getContrastColor(winner.color)};font-size:16px;font-family:'Cairo';font-weight:900;padding:14px 28px;">
        العودة للقائمة
      </button>
    </div>
  </div>`);

  overlay.querySelector('#btn-menu-home').onclick = () => { VIEW = BOARD_EDITABLE ? 'adminHome' : 'landing'; render(); };
  return overlay;
}

attachBattlesListener();
render();
