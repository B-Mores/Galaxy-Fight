<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حرب المجرات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10151c; --panel:#171f2a; --panel-light:#1e2836; --line:#2a3646;
    --gold:#c9a45c; --gold-dim:#8a7142; --ink:#e8e3d6; --ink-dim:#9aa5b4;
    --danger:#c0453f; --ok:#4b8f6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif;height:100%;}
  h1,h2,h3,.disp{font-family:'Cairo',sans-serif;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  .center-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;text-align:center;}
  .brand{font-weight:900;font-size:clamp(28px,6vw,46px);letter-spacing:1px;color:var(--gold);margin:0 0 6px;}
  .brand-sub{color:var(--ink-dim);margin:0 0 36px;font-size:15px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;width:100%;max-width:460px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:#1b1508;border:none;border-radius:10px;padding:13px 22px;font-family:'Cairo',sans-serif;font-weight:700;font-size:15px;cursor:pointer;transition:transform .1s, background .15s;width:100%;}
  .btn:hover{background:#dab976;}
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:transparent;border:1px solid var(--gold-dim);color:var(--gold);}
  .btn.secondary:hover{background:rgba(201,164,92,.1);}
  .btn.small{width:auto;padding:8px 14px;font-size:13px;}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.ok{background:var(--ok);color:#fff;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .stack{display:flex;flex-direction:column;gap:12px;margin-top:18px;}

  .battle-item{background:var(--panel-light);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;text-align:right;}
  .battle-item .meta{font-size:12px;color:var(--ink-dim);margin-top:4px;}
  .battle-item .name{font-weight:700;font-family:'Cairo',sans-serif;}

  input[type=text], input[type=number]{background:#0d1218;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px 12px;font-family:'Tajawal',sans-serif;font-size:14px;width:100%;}
  input:focus{outline:1px solid var(--gold-dim);}
  label{font-size:13px;color:var(--ink-dim);display:block;margin-bottom:6px;}

  .team-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
  .swatch{width:28px;height:28px;border-radius:50%;flex:0 0 28px;border:2px solid rgba(255,255,255,.25);}

  #board-screen{display:flex;flex-direction:column;height:100vh;}
  .topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .turn-pill{display:flex;align-items:center;gap:8px;font-family:'Cairo',sans-serif;font-weight:700;padding:6px 14px;border-radius:999px;background:var(--panel-light);border:1px solid var(--line);}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:0 0 12px;}
  .main-area{flex:1;display:flex;overflow:hidden;}
  .map-wrap{
    flex:1;overflow:auto;
    background-color:#050a15; 
    background-image: radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.2), transparent 40%),
                      radial-gradient(circle at 85% 30%, rgba(14, 116, 144, 0.2), transparent 40%);
    position:relative;
  }
  svg#map{width:100%;height:100%;min-width:900px;min-height:560px;background:#03060f;}
  .link{stroke:rgba(255,255,255,0.08);stroke-width:1.5; pointer-events:none;}
  .link.attackable{stroke:rgba(255,255,255,0.4);stroke-width:2.5;stroke-dasharray:4 4;}
  .celestial-glow{fill:none;stroke-width:3;stroke-opacity:0.2;transition:all .3s;}
  .celestial{cursor:default;transition:transform .2s, filter .2s;transform-origin:center;}
  .celestial.clickable-region{cursor:pointer;}
  .celestial.clickable-region:hover{transform:scale(1.15);filter:brightness(1.3);}
  .celestial.sel-attacker .celestial-glow{stroke:var(--gold) !important;stroke-width:7;stroke-opacity:1;}
  .celestial.sel-defender .celestial-glow{stroke:#fff !important;stroke-width:7;stroke-opacity:1;}

  .score-bar{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 10px;}
  .score-pill{display:flex;align-items:center;gap:6px;font-family:'Cairo',sans-serif;font-weight:700;font-size:12px;padding:6px 10px;border-radius:999px;background:var(--panel-light);border:1px solid var(--line);}
  .score-btn{
    width:20px;height:20px;border-radius:50%;border:1px solid var(--gold-dim);background:transparent;color:var(--gold);
    font-family:'Cairo',sans-serif;font-weight:900;font-size:13px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .score-btn:hover{background:rgba(201,164,92,.15);}

  .sidebar{width:300px;flex:0 0 300px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;}
  .side-sec{padding:14px 16px;border-bottom:1px solid var(--line);}
  .side-sec h3{margin:0 0 10px;font-size:13px;color:var(--gold);letter-spacing:.5px;}
  .team-card{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;}
  .team-card .name{flex:1;}
  .team-card.current{background:rgba(201,164,92,.08);border-radius:8px;padding:6px 8px;margin:0 -8px;}
  .team-card .stats{color:var(--ink-dim);font-size:11px;}
  .team-card.eliminated{opacity:.4;text-decoration:line-through;}

  .log{font-size:12px;color:var(--ink-dim);max-height:220px;overflow-y:auto;display:flex;flex-direction:column-reverse;gap:4px;}
  .log div{border-right:2px solid var(--line);padding-right:8px;}

  .action-panel{padding:14px 16px;}
  .action-panel p{font-size:13px;color:var(--ink-dim);margin:0 0 10px;line-height:1.7;}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;}
  .flash{font-size:12px;color:var(--danger);margin-top:8px;}

  .overlay{position:fixed;inset:0;background:rgba(4,6,12,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;overflow-y:auto;}
  .overlay .card{max-width:420px;text-align:center;}

  @keyframes victoryPulse{
    from{transform:scale(1);text-shadow:0 0 30px currentColor;}
    to{transform:scale(1.05);text-shadow:0 0 70px currentColor, 0 0 120px currentColor;}
  }
  @keyframes starBounce{
    from{transform:translateY(0) rotate(-5deg);opacity:0.8;}
    to{transform:translateY(-10px) rotate(5deg);opacity:1;}
  }
  @keyframes fadeSlideUp{
    from{opacity:0;transform:translateY(30px);}
    to{opacity:1;transform:translateY(0);}
  }
  .victory-wrap{animation:fadeSlideUp .6s ease forwards;}

  @media (max-width:760px){
    .sidebar{position:fixed;inset:0 0 0 auto;width:82vw;flex:0 0 82vw;transform:translateX(100%);transition:transform .25s;z-index:30;box-shadow:-8px 0 24px rgba(0,0,0,.4);}
    .sidebar.open{transform:translateX(0);}
    .map-wrap{width:100%;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>

function safeGet(key){ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; } }
function safeSet(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; } }
function safeSessionGet(key){ try{ const v=sessionStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; } }
function safeSessionSet(key,val){ try{ sessionStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; } }

const ADMIN_PASSWORD = 'Gravity2026';
let IS_ADMIN = !!safeSessionGet('galaxy_admin');
function adminLogin(){
  const pw = prompt('كلمة سر المنظم:');
  if(pw===null) return;

    safeSessionSet('galaxy_admin', true);

/* ============================= MAP GENERATION ============================= */
function buildWorld(){
  const regions = {};
  const ids = [];
  const adj = {};
  
  const types = ['planet', 'planet', 'planet', 'moon', 'moon', 'star'];
  const quadrants = [
    {cx: 200, cy: 150}, // 0: Top-Left
    {cx: 600, cy: 150}, // 1: Top-Right
    {cx: 200, cy: 450}, // 2: Bottom-Left
    {cx: 600, cy: 450}  // 3: Bottom-Right
  ];
  const numPerQuad = 10;
  
  quadrants.forEach((q, qIdx) => {
    for(let i=0; i<numPerQuad; i++){
      let x, y;
      let valid = false;
      for(let attempt=0; attempt<100; attempt++){
        x = q.cx - 150 + Math.random()*300;
        y = q.cy - 120 + Math.random()*240;
        valid = true;
        for(let j=0; j<ids.length; j++){
          const other = regions[ids[j]];
          if(Math.hypot(x-other.x, y-other.y) < 45) { valid = false; break; }
        }
        if(valid) break;
      }
      const t = types[Math.floor(Math.random()*types.length)];
      const r = t==='star'? 24 + Math.random()*8 : t==='planet'? 16 + Math.random()*6 : 9 + Math.random()*4;
      
      const id = 'body-'+qIdx+'-'+i;
      ids.push(id);
      regions[id] = { id, x, y, r, type: t, quadrant: qIdx };
      adj[id] = new Set();
    }
  });
  
  // Connect within quadrants
  ids.forEach(id1 => {
    const b1 = regions[id1];
    const dists = [];
    ids.forEach(id2 => {
      if(id1!==id2 && regions[id2].quadrant === b1.quadrant){
        const b2 = regions[id2];
        dists.push({id: id2, d: Math.hypot(b1.x-b2.x, b1.y-b2.y)});
      }
    });
    dists.sort((a,b)=>a.d - b.d);
    for(let i=0; i<2; i++){
      if(dists[i] && dists[i].d < 160){
        adj[id1].add(dists[i].id);
        adj[dists[i].id].add(id1);
      }
    }
  });

  // Cross-quadrant wormholes
  const links = [[0,1], [0,2], [1,3], [2,3]];
  links.forEach(([q1, q2]) => {
    const bodies1 = ids.filter(id => regions[id].quadrant === q1);
    const bodies2 = ids.filter(id => regions[id].quadrant === q2);
    let best = null;
    let minDist = Infinity;
    bodies1.forEach(b1 => {
      bodies2.forEach(b2 => {
        const d = Math.hypot(regions[b1].x-regions[b2].x, regions[b1].y-regions[b2].y);
        if(d < minDist) { minDist = d; best = [b1, b2]; }
      });
    });
    if(best){
      adj[best[0]].add(best[1]);
      adj[best[1]].add(best[0]);
    }
  });

  return { regions, adj, ids };
}
const WORLD = buildWorld();

/* ============================= STORAGE ============================= */
const INDEX_KEY = 'realm-battles-index';
let BATTLES_CACHE = safeGet(INDEX_KEY) || [];
let boardListenerRef = null;

function detachBoardListener(){
  if(boardListenerRef){ boardListenerRef.off('value'); boardListenerRef = null; }
}

function attachBattlesListener(){
  if(!db) return;
  db.ref('battles').on('value', snap=>{
    const val = snap.val() || {};
    BATTLES_CACHE = Object.keys(val).map(k=>{
      const b = val[k];
      return {id:b.id, name:b.name, teams:b.teams.map(t=>t.name), updatedAt:b.updatedAt||0, winner: b.winner===undefined?null:b.winner};
    }).sort((a,b)=>b.updatedAt-a.updatedAt);
    safeSet(INDEX_KEY, BATTLES_CACHE);
    if(VIEW==='landing' || VIEW==='list') render();
  });
}

async function loadIndex(){ return BATTLES_CACHE; }

async function saveBattle(state){
  state.updatedAt = Date.now();
  try{ localStorage.setItem('realm-battle:'+state.id, JSON.stringify(state)); }catch(e){}
  if(db){
    try{ await db.ref('battles/'+state.id).set(state); }catch(e){ console.error(e); }
  }
}
async function loadBattleLocal(id){ try{ const r=localStorage.getItem('realm-battle:'+id); return r?JSON.parse(r):null; }catch(e){ return null; } }
async function deleteBattleEverywhere(id){
  try{ localStorage.removeItem('realm-battle:'+id); }catch(e){}
  if(db){ try{ await db.ref('battles/'+id).remove(); }catch(e){} }
}

async function enterBoardView(id, editable){
  detachBoardListener();
  BOARD_EDITABLE = editable;
  let g = null;
  if(db){
    try{ const snap = await db.ref('battles/'+id).once('value'); g = snap.val(); }catch(e){}
  }
  if(!g) g = await loadBattleLocal(id);
  if(!g){ alert('المعركة دي مش موجودة أو اتحذفت.'); VIEW = editable ? 'adminHome' : 'landing'; render(); return; }
  if(g.winner===undefined) g.winner=null;
  if(Array.isArray(g.teams)) g.teams.forEach(t=>{ if(typeof t.score!=='number') t.score=0; if(typeof t.gamesPlayed!=='number') t.gamesPlayed=0; });
  if(!Array.isArray(g.log)) g.log=[];
  GAME = g; SEL={attacker:null,defender:null};
  SHOW_END_PICKER=false; FLASH=null;
  VIEW='board'; render();
  if(!editable && db){
    boardListenerRef = db.ref('battles/'+id);
    boardListenerRef.on('value', snap=>{
      const v = snap.val();
      if(v){
        if(v.winner===undefined) v.winner=null;
        if(Array.isArray(v.teams)) v.teams.forEach(t=>{ if(typeof t.score!=='number') t.score=0; if(typeof t.gamesPlayed!=='number') t.gamesPlayed=0; });
        if(!Array.isArray(v.log)) v.log=[];
      }
      if(v && VIEW==='board' && !BOARD_EDITABLE){ GAME = v; render(); }
    });
  }
}

/* ============================= APP STATE ============================= */
let VIEW = IS_ADMIN ? 'adminHome' : 'landing';
let SETUP={ names:[{team:'', galaxy:''}, {team:'', galaxy:''}, {team:'', galaxy:''}, {team:'', galaxy:''}] };
let GAME=null;
let BOARD_EDITABLE=true;
let SEL={ attacker:null, defender:null };
let FLASH=null;
let SIDEBAR_OPEN=false;
let SHOW_END_PICKER=false;
let HISTORY=[]; // undo stack - stores JSON snapshots of state

const TEAM_COLORS=['#22C55E','#EF4444','#3B82F6','#EAB308']; // أخضر، أحمر، أزرق، أصفر
const root=document.getElementById('app');
function uid(){ return 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ============================= GAME LOGIC ============================= */
function newGameState(name, setups){
  const teams = setups.map((s,i)=>({
    id:i, 
    name:s.team||('الفريق '+(i+1)), 
    galaxyName:s.galaxy||('مجرة '+(i+1)), 
    color:TEAM_COLORS[i], 
    eliminated:false,
    score:0,
    gamesPlayed:0
  }));
  const regions={};
  WORLD.ids.forEach(id=>{
    const r = WORLD.regions[id];
    regions[id] = r.quadrant; 
  });
  return {
    id: uid(), name: name || 'حرب المجرات العظمى',
    teams, regions,
    log: ['بدأت المعركة! المنظم هو اللي بيحدد مين بيلعب ضد مين.'],
    winner: null,
  };
}
function ownedBy(state, teamId){ return [...WORLD.ids, ...(state.extraPlanets ? Object.keys(state.extraPlanets) : [])].filter(id=>state.regions[id]===teamId); }
function activeTeams(state){ return state.teams.filter(t=>!t.eliminated); }
function checkElimination(state){ state.teams.forEach(t=>{ if(!t.eliminated && ownedBy(state,t.id).length===0) t.eliminated=true; }); }

function saveSnapshot(){
  if(!GAME) return;
  HISTORY.push(JSON.stringify({ regions: GAME.regions, log: [...GAME.log], teams: JSON.parse(JSON.stringify(GAME.teams)), extraPlanets: GAME.extraPlanets ? {...GAME.extraPlanets} : {} }));
  if(HISTORY.length > 30) HISTORY.shift();
}

function undoStep(){
  if(!BOARD_EDITABLE || HISTORY.length===0) return;
  const snap = JSON.parse(HISTORY.pop());
  GAME.regions = snap.regions;
  GAME.log = snap.log;
  GAME.teams = snap.teams;
  GAME.extraPlanets = snap.extraPlanets || {};
  SEL={attacker:null,defender:null};
  saveBattle(GAME); render();
}

function adjustScore(teamId, delta){
  if(!BOARD_EDITABLE) return;
  const state = GAME;
  const t = state.teams[teamId];
  if(!state.extraPlanets) state.extraPlanets = {};
  saveSnapshot();
  
  if(delta > 0) {
    // Create a brand-new planet outside the galaxy for this team
    const q = t.id; // quadrant matches team id (0-3)
    const quadCenters = [{cx:200,cy:150},{cx:600,cy:150},{cx:200,cy:450},{cx:600,cy:450}];
    const qc = quadCenters[q];
    let x, y;
    // Try to find a non-overlapping spot
    let placed = false;
    for(let attempt=0; attempt<200; attempt++){
      x = qc.cx - 160 + Math.random()*320;
      y = qc.cy - 130 + Math.random()*260;
      const allIds = [...WORLD.ids, ...Object.keys(state.extraPlanets)];
      const allRegions = {...WORLD.regions, ...state.extraPlanets};
      let ok = true;
      for(const oid of allIds){
        const o = allRegions[oid];
        if(o && Math.hypot(x-o.x, y-o.y) < 38){ ok=false; break; }
      }
      if(ok){ placed=true; break; }
    }
    if(!placed){ x = qc.cx + (Math.random()-0.5)*280; y = qc.cy + (Math.random()-0.5)*220; }
    const newId = 'extra-'+teamId+'-'+Date.now();
    state.extraPlanets[newId] = { id:newId, x, y, r: 14+Math.random()*6, type:'planet', quadrant:q, isExtra:true };
    state.regions[newId] = teamId;
    state.log.push(`🌍 كوكب جديد انضم لـ ${t.name}!`);
  } else if(delta < 0) {
    const owned = ownedBy(state, teamId);
    if(!owned.length) return;
    // Prefer removing extra planets first, then edge planets
    const extraOwned = owned.filter(id => state.extraPlanets && state.extraPlanets[id]);
    let target = null;
    if(extraOwned.length) {
      target = extraOwned[Math.floor(Math.random()*extraOwned.length)];
    } else {
      // Pick an edge planet from main world
      let edgeCands = owned.filter(id => {
        let isEdge = false;
        WORLD.adj[id] && WORLD.adj[id].forEach(adjId => { if(state.regions[adjId] !== teamId) isEdge=true; });
        return isEdge;
      });
      if(!edgeCands.length) edgeCands = owned;
      target = edgeCands[Math.floor(Math.random()*edgeCands.length)];
    }
    if(target){
      delete state.regions[target];
      if(state.extraPlanets && state.extraPlanets[target]) delete state.extraPlanets[target];
      state.log.push(`💥 منطقة من ${t.name} اختفت!`);
    }
  }
  
  checkElimination(state);
  saveBattle(state); render();
}

function declareWinner(state){
  // Auto-determine winner by most regions
  let maxRegions = -1;
  let winnerId = null;
  state.teams.forEach(t=>{
    if(!t.eliminated){
      const cnt = ownedBy(state, t.id).length;
      if(cnt > maxRegions){ maxRegions = cnt; winnerId = t.id; }
    }
  });
  if(winnerId === null) winnerId = state.teams[0].id; // fallback
  state.winner = winnerId;
  state.log.push(`🎉🏆 انتهت المسابقة! الفايز: ${state.teams[winnerId].name} بـ ${maxRegions} منطقة`);
  SHOW_END_PICKER=false;
  SEL={attacker:null,defender:null};
  saveBattle(state); render();
}

/* ============================= RENDER HELPERS ============================= */
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function render(){
  if(!IS_ADMIN){
    if(['adminHome','setup','list'].includes(VIEW)) VIEW='landing';
    if(VIEW==='board' && BOARD_EDITABLE) VIEW='landing';
  }
  if(VIEW!=='board') detachBoardListener();
  root.innerHTML='';
  if(VIEW==='landing') root.appendChild(renderLanding());
  else if(VIEW==='adminHome') root.appendChild(renderAdminHome());
  else if(VIEW==='list') root.appendChild(renderList());
  else if(VIEW==='setup') root.appendChild(renderSetup());
  else if(VIEW==='board') root.appendChild(renderBoard());
}

function renderLanding(){
  const wrap=el(`<div class="center-screen">
    <div class="brand">🚀 حرب المجرات</div>
    <p class="brand-sub">تابع نتايج المعارك أول بأول</p>
    <div class="card" style="text-align:right;">
      <div id="list-holder"></div>
      <div class="stack" style="margin-top:18px;">
        <button class="btn secondary" id="btn-admin">🔑 دخول المنظم</button>
      </div>

function svgMap(){
  const state=GAME;
  
  let defs = `
    <defs>
      <radialGradient id="grad-overlay-star" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
        <stop offset="30%" stop-color="#fff" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="grad-overlay-planet" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#fff" stop-opacity="0.6"/>
        <stop offset="70%" stop-color="#000" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0.9"/>
      </radialGradient>
    </defs>
  `;
  
  let bgStars = '';
  // Deterministic-looking stars so they don't jump around on render
  for(let i=0; i<150; i++){
     const sx = (Math.sin(i*123.45)*0.5+0.5)*800;
     const sy = (Math.cos(i*321.54)*0.5+0.5)*600;
     bgStars += `<circle cx="${sx}" cy="${sy}" r="${(i%3)*0.5+0.5}" fill="#fff" opacity="${0.1+(i%5)*0.1}"/>`;
  }
  
  let links = '';
  const drawn = new Set();
  WORLD.ids.forEach(id1 => {
    WORLD.adj[id1].forEach(id2 => {
      const pair = [id1,id2].sort().join('|');
      if(!drawn.has(pair)){
        drawn.add(pair);
        const b1 = WORLD.regions[id1];
        const b2 = WORLD.regions[id2];
        links += `<line x1="${b1.x}" y1="${b1.y}" x2="${b2.x}" y2="${b2.y}" class="link"/>`;
      }
    });
  });

  let bodies = '';
  const allPlanetIds = [...WORLD.ids, ...(state.extraPlanets ? Object.keys(state.extraPlanets) : [])];
  const allPlanetData = { ...WORLD.regions, ...(state.extraPlanets || {}) };
  allPlanetIds.forEach(id=>{
    if(!(id in state.regions)) return; // deleted planet
    const r = allPlanetData[id];
    if(!r) return;
    const owner=state.regions[id];
    const team = owner !== null && owner !== undefined ? state.teams[owner] : null;
    const cls=['celestial'];
    if(BOARD_EDITABLE && state.winner===null) cls.push('clickable-region');
    if(SEL.attacker===id) cls.push('sel-attacker');
    if(SEL.defender===id) cls.push('sel-defender');
    
    const glowColor = team ? team.color : 'rgba(255,255,255,0.1)';
    const baseColor = team ? team.color : '#555';
    let overlayId = r.type==='star' ? 'grad-overlay-star' : 'grad-overlay-planet';
    
    bodies += `
      <g class="${cls.join(' ')}" data-id="${id}" style="transform-origin: ${r.x}px ${r.y}px">
        <circle cx="${r.x}" cy="${r.y}" r="${r.r+6}" class="celestial-glow" stroke="${glowColor}"/>
        <circle cx="${r.x}" cy="${r.y}" r="${r.r}" fill="${baseColor}"/>
        <circle cx="${r.x}" cy="${r.y}" r="${r.r}" fill="url(#${overlayId})" pointer-events="none"/>
      </g>
    `;
  });

  let galaxyLabels = '';
  if(state.teams.length === 4){
    // Center of each quadrant
    const quads = [
      {cx:200, cy:150},  // Top-Left  (team 0)
      {cx:600, cy:150},  // Top-Right (team 1)
      {cx:200, cy:450},  // Bottom-Left (team 2)
      {cx:600, cy:450}   // Bottom-Right (team 3)
    ];
    quads.forEach((q, i) => {
      const t = state.teams[i];
      const owned = ownedBy(state, i);
      // Compute actual centroid of owned planets for this team
      let cx = q.cx, cy = q.cy;
      if(owned.length > 0){
        const allPD = { ...WORLD.regions, ...(state.extraPlanets||{}) };
        let sumX=0, sumY=0;
        owned.forEach(id=>{ const p=allPD[id]; if(p){ sumX+=p.x; sumY+=p.y; } });
        cx = sumX/owned.length;
        cy = sumY/owned.length;
      }
      // Shadow for readability
      galaxyLabels += `
        <text x="${cx}" y="${cy-10}" fill="#000" font-size="18" font-family="'Cairo',sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="middle" opacity="0.6" style="pointer-events:none;" dx="1" dy="1">${t.galaxyName}</text>
        <text x="${cx}" y="${cy-10}" fill="${t.color}" font-size="18" font-family="'Cairo',sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="middle" opacity="0.95" style="pointer-events:none;">${t.galaxyName}</text>
        <text x="${cx}" y="${cy+12}" fill="#000" font-size="12" font-family="'Cairo',sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="middle" opacity="0.7" style="pointer-events:none;" dx="1" dy="1">⚔️ ${t.gamesPlayed||0} ألعاب</text>
        <text x="${cx}" y="${cy+12}" fill="#cbd5e1" font-size="12" font-family="'Cairo',sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="middle" opacity="0.9" style="pointer-events:none;">⚔️ ${t.gamesPlayed||0} ألعاب</text>
      `;
    });
  }

  let supernova = '';
  if(state.winner !== null){
    const winnerColor = state.teams[state.winner].color;
    let maxId = WORLD.ids[0];
    WORLD.ids.forEach(id=>{ if(WORLD.regions[id].r > WORLD.regions[maxId].r) maxId = id; });
    const big = WORLD.regions[maxId];
    supernova = `
      <circle cx="${big.x}" cy="${big.y}" r="${big.r*4}" fill="${winnerColor}" opacity="0.12"/>
      <circle cx="${big.x}" cy="${big.y}" r="${big.r}" fill="${winnerColor}">
        <animate attributeName="r" values="${big.r};${big.r*2.6};${big.r}" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.95;0.25;0.95" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="${big.x}" cy="${big.y}" r="${big.r*1.5}" fill="none" stroke="${winnerColor}" stroke-width="3">
        <animate attributeName="r" values="${big.r*1.5};${big.r*4.5};${big.r*1.5}" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    `;
  }

  return `<svg id="map" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">${defs}${bgStars}${links}${bodies}${supernova}${galaxyLabels}</svg>`;
}

function resolveAttack(state, attackerWon){
  const attackerTeamId=state.regions[SEL.attacker];
  const attackerTeam=state.teams[attackerTeamId];
  const defenderTeam=state.regions[SEL.defender] !== null && state.regions[SEL.defender] !== undefined ? state.teams[state.regions[SEL.defender]] : null;
  saveSnapshot();
  // Count games played for galaxy battles
  attackerTeam.gamesPlayed = (attackerTeam.gamesPlayed || 0) + 1;
  if(defenderTeam){
    defenderTeam.gamesPlayed = (defenderTeam.gamesPlayed || 0) + 1;
  }
  if(attackerWon){
    state.regions[SEL.defender]=attackerTeamId;
    state.log.push(`🏆 استولى ${attackerTeam.name} على منطقة ${defenderTeam ? `تابعة لـ ${defenderTeam.name}` : 'محايدة'}`);
    // Loser loses a region (if they have one) - pick edge region
    if(defenderTeam){
      const defTeamId = state.teams.indexOf(defenderTeam);
      const defOwned = ownedBy(state, defTeamId);
      if(defOwned.length > 0){
        const extraOwned = defOwned.filter(id => state.extraPlanets && state.extraPlanets[id]);
        let lostId = null;
        if(extraOwned.length){
          lostId = extraOwned[Math.floor(Math.random()*extraOwned.length)];
        } else {
          let edgeCands = defOwned.filter(id=>{
            let isEdge=false;
            if(WORLD.adj[id]) WORLD.adj[id].forEach(a=>{ if(state.regions[a]!==defTeamId) isEdge=true; });
            return isEdge && id !== SEL.defender;
          });
          if(!edgeCands.length) edgeCands = defOwned.filter(id=>id!==SEL.defender);
          if(!edgeCands.length) edgeCands = defOwned;
          lostId = edgeCands[Math.floor(Math.random()*edgeCands.length)];
        }
        if(lostId){
          delete state.regions[lostId];
          if(state.extraPlanets && state.extraPlanets[lostId]) delete state.extraPlanets[lostId];
          state.log.push(`💥 منطقة من ${defenderTeam.name} اختفت!`);
        }
      }
    }
  }else{
    if(defenderTeam) {
        state.log.push(`🛡 صد ${defenderTeam.name} تحدي ${attackerTeam.name} وحافظ على منطقته`);
    } else {
        state.log.push(`🛡 فشل ${attackerTeam.name} في السيطرة على المنطقة`);
    }
  }
  SEL={attacker:null,defender:null};
  checkElimination(state);
  saveBattle(state); render();
}

function handleRegionClick(id){
  if(!BOARD_EDITABLE) return;
  const state=GAME;
  if(state.winner!==null) return;
  if(!SEL.attacker){
    SEL.attacker=id; FLASH=null; render(); return;
  }
  if(SEL.attacker===id){ SEL={attacker:null,defender:null}; render(); return; }
  if(!SEL.defender){
    if(state.regions[id]!==null && state.regions[id]!==undefined && state.regions[id]===state.regions[SEL.attacker]){
      FLASH='المنطقتين تابعين لنفس الفريق، اختار منطقة من فريق تاني.'; render(); return;
    }
    SEL.defender=id; FLASH=null; render(); return;
  }
  SEL={attacker:id, defender:null}; FLASH=null; render();
}

  const medals = ['\u{1F947}','\u{1F948}','\u{1F949}','4⃣'];

  const rankRows = ranking.map((t, i) => {
    const cnt = ownedBy(state, t.id).length;
    const isWinner = t.id === state.winner;
    return `<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;
      background:${isWinner ? t.color+'28' : 'rgba(255,255,255,0.03)'};
      border:1px solid ${isWinner ? t.color+'55' : 'rgba(255,255,255,0.06)'};
      margin-bottom:6px;">
      <span style="font-size:22px;width:28px;text-align:center;">${medals[i]||''}</span>
      <span style="width:12px;height:12px;border-radius:50%;background:${t.color};flex:0 0 12px;"></span>
      <span style="flex:1;font-family:'Cairo';font-weight:700;font-size:14px;text-align:right;">${t.name} — ${t.galaxyName}</span>
      <span style="font-family:'Cairo';font-size:13px;color:${isWinner ? t.color : 'var(--ink-dim)'};
        font-weight:${isWinner ? '900' : '400'}">${cnt} منطقة · ⚔️ ${t.gamesPlayed||0} ألعاب</span>
    </div>`;
  }).join('');

  const overlay = el(`<div class="overlay">
    <div class="victory-wrap" style="text-align:center;padding:36px 24px 28px;max-width:540px;width:100%;">

      <div style="font-size:40px;letter-spacing:6px;margin-bottom:12px;
        animation:starBounce 1.1s ease-in-out infinite alternate;">&#11088;&#127881;&#11088;</div>

      <div style="font-family:'Cairo',sans-serif;font-weight:900;
        font-size:clamp(60px,14vw,96px);line-height:1;
        color:${winner.color};
        animation:victoryPulse 1.3s ease-in-out infinite alternate;
        text-shadow:0 0 40px ${winner.color}77, 0 4px 0 rgba(0,0,0,.7);
        margin-bottom:16px;">&#x645;&#x628;&#x631;&#x648;&#x648;&#x648;&#x643;!</div>

      <div style="font-family:'Cairo',sans-serif;font-weight:900;
        font-size:clamp(30px,8vw,52px);
        color:#fff;
        text-shadow:0 0 24px ${winner.color}88;
        margin-bottom:4px;">&#127942; ${winner.galaxyName} &#127942;</div>

      <div style="font-size:16px;color:${winner.color};font-family:'Cairo';font-weight:700;margin-bottom:4px;">${winner.name}</div>
      <div style="font-size:14px;color:var(--ink-dim);margin-bottom:28px;">
        &#x633;&#x64A;&#x637;&#x631; &#x639;&#x644;&#x649; <b style="color:${winner.color};">${winnerRegions}</b> &#x645;&#x646;&#x637;&#x642;&#x629;
      </div>

      <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
        border-radius:14px;padding:16px;margin-bottom:24px;text-align:right;">
        <div style="font-family:'Cairo';font-weight:700;font-size:13px;color:var(--gold);
          margin-bottom:12px;text-align:center;">&#x1F3C5; &#x627;&#x644;&#x62A;&#x631;&#x62A;&#x64A;&#x628; &#x627;&#x644;&#x646;&#x647;&#x627;&#x626;&#x64A;</div>
        ${rankRows}
      </div>

      <button class="btn" id="btn-menu-home"
        style="background:${winner.color};color:#111;font-size:16px;font-family:'Cairo';font-weight:900;padding:14px 28px;">
        &#x627;&#x644;&#x639;&#x648;&#x62F;&#x629; &#x644;&#x644;&#x642;&#x627;&#x626;&#x645;&#x629;
      </button>
    </div>
  </div>`);

  overlay.querySelector('#btn-menu-home').onclick = () => { VIEW = BOARD_EDITABLE ? 'adminHome' : 'landing'; render(); };
  return overlay;
}

attachBattlesListener();
render();
</script>
</body>
</html>
